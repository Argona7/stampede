[project]
name = "stampede"
version = "0.1.0"
description = "Read-only map of observed wallet rotations between memecoins on Robinhood Chain (PONS v2 sample)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "eth-hash[pycryptodome]>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "textual>=8.2.8",
    "hypersync>=1.2.1",
    "pillow>=10",
    "websockets>=17.1",
]

[project.scripts]
stampede = "stampede.cli:main"

[project.optional-dependencies]
research = [
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stampede"]

[tool.pytest.ini_options]
testpaths = ["tests"]
